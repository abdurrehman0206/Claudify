<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Claudify">
  <title>Claudify</title>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE9670" />
      <stop offset="0.55" stop-color="#D9775A" />
      <stop offset="1" stop-color="#B8512F" />
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Punches a clean gap around the front panel so the two layers read as
         separate sheets rather than one merged blob. -->
    <mask id="separate">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="384" y="384" width="510" height="510" rx="124" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#plate)" />
  <rect width="1024" height="1024" rx="230" fill="url(#sheen)" />

  <g fill="#fff">
    <rect x="170" y="170" width="430" height="430" rx="104"
          opacity="0.66" mask="url(#separate)" />
    <rect x="424" y="424" width="430" height="430" rx="104" />
  </g>
</svg>
